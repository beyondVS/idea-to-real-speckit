<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem Inquiry Engine</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background-color: #f4f4f9; display: flex; gap: 20px; }
        #sidebar { width: 200px; padding: 15px; background: #fff; border: 1px solid #ccc; border-radius: 8px; }
        #main-content { flex-grow: 1; }
        #chat-container { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 15px; background-color: #fff; border-radius: 8px; margin-bottom: 20px; }
        .message { margin-bottom: 15px; padding: 10px; border-radius: 5px; position: relative; }
        .user { background-color: #e3f2fd; text-align: right; }
        .assistant { background-color: #f1f8e9; text-align: left; }
        .rollback-btn { font-size: 11px; color: #2196f3; cursor: pointer; text-decoration: underline; margin-right: 5px; }
        #input-area { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #2196f3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { background-color: #ccc; }
        #loading { display: none; color: #666; font-style: italic; }
        #result-area { display: none; margin-top: 20px; padding: 20px; border: 2px solid #4caf50; border-radius: 8px; background-color: #e8f5e9; }
        .rating-stars { display: flex; gap: 5px; margin: 10px 0; }
        .star { font-size: 24px; cursor: pointer; color: #ccc; }
        .star.active { color: #ffc107; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h3>분기 탐색기</h3>
        <ul id="branch-list">
            <li>(메인 흐름)</li>
        </ul>
        <hr>
        <a href="/inquiry/dashboard/">내 이력 보기</a>
    </div>

    <div id="main-content">
        <h1>진단 엔진 (Inquiry Engine)</h1>
        <div id="turn-info" style="margin-bottom: 10px; font-size: 0.9em; color: #666;">질의 진행: <span id="turn-count">0</span> / 5</div>
        <div id="chat-container">
            <div class="message assistant">분석하고 싶은 모호한 문제 상황이나 아이디어를 입력해 주세요.</div>
        </div>
        <div id="loading">분석 대기 중...</div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="여기에 입력하세요...">
            <button id="send-btn">전송</button>
        </div>

        <div id="result-area">
            <h3>🎉 근본 원인이 파악되었습니다!</h3>
            <div id="root-cause-report" style="background: white; padding: 15px; border-radius: 5px; margin-bottom: 15px; border-left: 5px solid #4caf50;">
                <p><strong>[도출된 근본 원인]</strong></p>
                <div id="root-cause-content" style="font-size: 1.1em; margin-bottom: 10px;"></div>
                <p><strong>[분석 확신도]</strong>: <span id="root-cause-confidence"></span></p>
            </div>
            <p>파악된 내용과 인과관계가 정리된 전체 보고서를 확인하시겠습니까?</p>
            <button id="download-btn">Markdown 보고서 생성 및 다운로드</button>
            <div id="survey-area" style="margin-top: 20px; border-top: 1px solid #ccc; padding-top: 15px;">
                <h4>진단 결과에 만족하시나요? (1-5점)</h4>
                <div class="rating-stars">
                    <span class="star" data-value="1">★</span><span class="star" data-value="2">★</span><span class="star" data-value="3">★</span><span class="star" data-value="4">★</span><span class="star" data-value="5">★</span>
                </div>
                <button id="submit-rating" disabled>평가 제출</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let sessionId = urlParams.get('session_id');
        let selectedRating = 0;
        let currentTurn = 0;

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const loading = document.getElementById('loading');
        const resultArea = document.getElementById('result-area');
        const downloadBtn = document.getElementById('download-btn');
        const submitRatingBtn = document.getElementById('submit-rating');
        const turnCountSpan = document.getElementById('turn-count');

        // 페이지 로드 시 기존 세션 이력 가져오기
        window.addEventListener('DOMContentLoaded', async () => {
            if (sessionId) {
                toggleLoading(true);
                try {
                    const res = await fetch(`/inquiry/api/inquiry/${sessionId}/history/`);
                    const data = await res.json();
                    if (data.messages && data.messages.length > 0) {
                        chatContainer.innerHTML = '';
                        data.messages.forEach((msg, idx) => {
                            appendMessage(msg.role, msg.content);
                        });
                        updateState(data);
                    }
                } catch (err) {
                    console.error('이력 로딩 실패:', err);
                } finally {
                    toggleLoading(false);
                }
            }
        });

        function appendMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<div>${content}</div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function updateState(data) {
            currentTurn = data.turn_count || 0;
            turnCountSpan.innerText = currentTurn;

            // 1. 근본 원인 리포트 표시
            if (data.root_cause && data.root_cause.root_cause_found) {
                document.getElementById('root-cause-content').innerText = data.root_cause.content;
                document.getElementById('root-cause-confidence').innerText = data.root_cause.confidence_label;
                
                // 상세화 불가능한 경우에만 결과 영역 표시 (상세화 가능 시 대화 계속)
                if (!data.root_cause.can_detail) {
                    resultArea.style.display = 'block';
                }
            }

            // 2. 연장 승인 UI
            if (currentTurn >= 5 && !data.is_extension_approved && (!data.root_cause || !data.root_cause.root_cause_found)) {
                showApprovalButtons();
            }

            // 3. 무의미한 답변 반복으로 인한 종료
            if (data.invalid_response_count >= 3) {
                appendMessage('assistant', '⚠️ 의미 있는 답변이 반복되지 않아 진단을 종료합니다. 현재까지의 내용을 바탕으로 보고서를 확인해 주세요.');
                resultArea.style.display = 'block';
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            appendMessage('user', text);
            userInput.value = '';
            toggleLoading(true);

            try {
                const url = sessionId ? `/inquiry/api/inquiry/${sessionId}/chat/` : '/inquiry/api/inquiry/start/';
                const body = sessionId ? { answer: text } : { initial_input: text };
                const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                const data = await res.json();

                if (!sessionId) {
                    sessionId = data.session_id;
                    history.pushState(null, '', `?session_id=${sessionId}`);
                }
                
                appendMessage('assistant', data.question);
                updateState(data);

            } catch (err) {
                appendMessage('assistant', '오류 발생: 서버와의 통신이 원활하지 않습니다.');
            } finally {
                toggleLoading(false);
            }
        }

        function showApprovalButtons() {
            const div = document.createElement('div');
            div.id = 'approval-area';
            div.style.marginTop = '10px';
            div.innerHTML = `
                <button onclick="sendApproval(true)">네, 계속할게요</button>
                <button style="background-color: #f44336; margin-left: 5px;" onclick="sendApproval(false)">아니요, 여기까지 할게요</button>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendApproval(approved) {
            document.getElementById('approval-area').remove();
            if (!approved) {
                appendMessage('assistant', "알겠습니다. 현재까지의 정보를 바탕으로 진단을 종료합니다.");
                resultArea.style.display = 'block';
                return;
            }
            
            toggleLoading(true);
            try {
                // 연장 승인 처리를 위해 서버에 'Yes' 답변 전송 (is_extension_approved 상태를 업데이트하도록 flows 설계 필요)
                const res = await fetch(`/inquiry/api/inquiry/${sessionId}/chat/`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ answer: "질의를 연장하겠습니다." }) 
                });
                const data = await res.json();
                appendMessage('assistant', data.question);
                updateState(data);
            } catch (err) {
                console.error(err);
            } finally {
                toggleLoading(false);
            }
        }

        async function rollback(step) {
            if (!confirm(`${step}단계로 되돌리시겠습니까? 현재 이후의 기록은 새 분기로 관리됩니다.`)) return;
            toggleLoading(true);
            try {
                const res = await fetch(`/inquiry/api/inquiry/${sessionId}/rollback/`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ target_step: step }) });
                const data = await res.json();
                appendMessage('assistant', `--- ${step}단계로 롤백되었습니다 ---`);
                appendMessage('assistant', data.last_question);
                currentStep = step;
            } finally {
                toggleLoading(false);
            }
        }

        function toggleLoading(isLoading) {
            userInput.disabled = isLoading;
            sendBtn.disabled = isLoading;
            loading.style.display = isLoading ? 'block' : 'none';
        }

        function showConsentButtons() {
            const div = document.createElement('div');
            div.style.marginTop = '10px';
            div.innerHTML = `
                <button onclick="confirmCompletion(true)">네, 완료할게요</button>
                <button style="background-color: #f44336; margin-left: 5px;" onclick="confirmCompletion(false)">아니요, 더 물어볼게요</button>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function confirmCompletion(agree) {
            if (!agree) { appendMessage('assistant', "알겠습니다. 진단을 계속 진행합니다."); return; }
            toggleLoading(true);
            try {
                const res = await fetch(`/inquiry/api/inquiry/${sessionId}/confirm/`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: sessionId }) });
                const data = await res.json();
                resultArea.style.display = 'block';
                downloadBtn.onclick = () => downloadFile(data.data.markdown, `report_${sessionId}.md`);
            } finally {
                toggleLoading(false);
            }
        }

        function downloadFile(content, filename) {
            const blob = new Blob([content], { type: 'text/markdown' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.click();
        }

        document.querySelectorAll('.star').forEach(star => {
            star.onclick = () => {
                selectedRating = star.dataset.value;
                document.querySelectorAll('.star').forEach(s => s.classList.toggle('active', s.dataset.value <= selectedRating));
                submitRatingBtn.disabled = false;
            };
        });

        submitRatingBtn.onclick = async () => {
            const res = await fetch(`/inquiry/api/inquiry/${sessionId}/rate/`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rating: parseInt(selectedRating) }) });
            const data = await res.json();
            alert(data.message || data.error);
            if (!data.error) document.getElementById('survey-area').style.display = 'none';
        };

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
